<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="container">
<header class="heading">
<h1>Student Registration</h1>
<p>Enter student details to register a new student</p>
</header>
<section class="card">
<h2>Student Details</h2>
<form id="studentForm">
<div class="form-grid">
<div class="form-group">
<label for="firstName">First Name</label>
<input type="text" id="firstName" placeholder="Enter first name" required></div>
<div class="form-group">
<label for="lastName">Last Name</label>
<input type="text" id="lastName" placeholder="Enter last name" required></div>
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" placeholder="Enter email address" required></div>
<div class="form-group">
<label for="address">Address</label>
<input type="text" id="address" placeholder="Enter address" required></div>
<div class="form-group">
<label for="pincode">Pincode</label>
<input type="text" id="pincode" placeholder="Enter pincode" pattern="[0-9]{6}" maxlength="6" title="Enter a valid 6-digit pincode" required></div>
<div class="form-group">
<label>Gender</label>
<div class="gender-options">
<label><input type="radio" name="gender" value="Male" required>Male</label>
<label><input type="radio" name="gender" value="Female" required>Female</label>
<label><input type="radio" name="gender" value="Other" required>Other</label>
</div>
</div>
<div class="form-group">
<label for="state">State</label>
<input type="text" id="state" placeholder="Enter state" required></div>
<div class="form-group">
<label for="country">Country</label>
<input type="text" id="country" placeholder="Enter country" required></div>
</div>
<button type="submit" class="submit-btn">Submit Details</button>
</form>
</section>
<!-- Table displaying registered students -->
<section class="card">
<h2>Registered Students</h2>
<div class="table-wrapper">
<table>
<thead>
<tr>
<th>First Name</th>
<th>Last Name</th>
<th>Email</th>
<th>Address</th>
<th>Pincode</th>
<th>Gender</th>
<th>State</th>
<th>Country</th>
</tr>
</thead>
<tbody id="studentTableBody">
<tr id="emptyRow">
<td colspan="8" class="empty-message">No student records available.</td>
</tr>
</tbody>
</table>
</div>
</section>
</main>
</body>
</html>
